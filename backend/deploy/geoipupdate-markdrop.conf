# Installed by backend/deploy/provision.sh as /etc/systemd/system/geoipupdate.service.d/markdrop.conf.
# The packaged unit is ProtectSystem=strict, so geoipupdate could not write the database where
# MARKDROP_GEOIP_DB_PATH (and /etc/GeoIP.conf's DatabaseDirectory) point.
[Service]
ReadWritePaths=/opt/markdrop/geoip
