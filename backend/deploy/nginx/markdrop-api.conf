server {
    listen 80;
    server_name api.markdrop.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.markdrop.in;

    ssl_certificate     /etc/letsencrypt/live/api.markdrop.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.markdrop.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;



    # Paste-HTML and VS Code sync send the document as a JSON body, so nginx has
    # to accept it. The default is 1 MB, which silently 413d anything larger
    # before the app could apply its own, larger limit. Sits above the app cap;
    # file uploads are unaffected either way, they go straight to R2.
    client_max_body_size 32m;

    # ── Compression ───────────────────────────────────────────────────────────
    # nginx.conf has "gzip on" but leaves gzip_types and gzip_proxied at their
    # defaults, which means text/html only and NOTHING proxied — so API JSON was
    # shipping uncompressed. Both are required for a reverse-proxied API.
    gzip              on;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_types        application/json application/javascript application/xml
                      text/plain text/css text/xml image/svg+xml;

    # ── WebSocket (P2P signalling) — MUST precede the general location block ──
    location /ws/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── MCP endpoint and OAuth token exchange ──
    # Claude, ChatGPT and other AI apps call these from a handful of shared
    # server IPs on behalf of all their users, so the per-IP "api" zone would
    # throttle every one of those users together. Own, wider zones here; the
    # app still limits each Markdrop user (MCP: 60 writes / 300 reads a minute).
    location = /mcp {
        limit_req zone=mcp burst=200 nodelay;
        proxy_pass         http://markdrop_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /oauth/token {
        limit_req zone=oauth_token burst=100 nodelay;
        proxy_pass         http://markdrop_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Regular HTTP API ──
    location / {
        limit_req zone=api burst=200 nodelay;
        proxy_pass         http://markdrop_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
