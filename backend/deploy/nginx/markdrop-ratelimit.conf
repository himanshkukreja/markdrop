# Coarse per-IP backstop for the API.
#
# Was 60r/m — one request per second. That is fine for a page that makes one
# call, and wrong for a signed-in app: opening workspace settings legitimately
# needs several calls, and each is preceded by a CORS preflight, so a single
# page view cost ~16 requests and two views spent the whole burst. Everything
# after that came back 503, which looks exactly like the API being broken.
#
# 5r/s with a burst of 40 still caps scraping hard, and the real per-endpoint
# limits live in the application (slowapi), which is where they belong — a
# login attempt and a document read should not share one budget.
limit_req_zone $binary_remote_addr zone=api:10m rate=1200r/m;

# 503 is "service unavailable", which is a lie: the service is fine, the client
# is being throttled. 429 says so, and tells a client it may retry.
limit_req_status 429;

# MCP and OAuth token traffic arrives from AI vendors' shared IPs (see the
# location blocks in sites-available/markdrop-api). Wider per-IP backstops.
limit_req_zone $binary_remote_addr zone=mcp:10m rate=3000r/m;
limit_req_zone $binary_remote_addr zone=oauth_token:10m rate=1200r/m;

# Reuse connections to uvicorn instead of a new TCP handshake per request.
upstream markdrop_api {
    server 127.0.0.1:8080;
    keepalive 32;
}
