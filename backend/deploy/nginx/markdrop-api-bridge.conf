# provision.sh bridge: this server no longer runs the API — it forwards every request to the
# server that does (__TARGET__), so clients still resolving __DOMAIN__ to this IP keep working while
# DNS changes spread. The target's nginx trusts our X-Forwarded-For (provision.sh realip), so rate
# limits and the app still see the real client IP. Remove with: provision.sh bridge off
server {
    listen 80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    # (proxy_set_header is not inherited by a location that sets its own, so each sets all of them)
    proxy_ssl_server_name on;
    proxy_ssl_name        __DOMAIN__;
    proxy_http_version    1.1;

    location /ws/ {
        proxy_pass         https://__TARGET__;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              __DOMAIN__;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         https://__TARGET__;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              __DOMAIN__;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
