[Service]
# 2026-11-09: OOM fix. glibc keeps one malloc arena per thread; the threadpool made RSS ratchet up.
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_TRIM_THRESHOLD_=131072
# Soft pressure at 1.1G, hard cap 1.5G (+512M swap) -> clean restart instead of a box-wide OOM.
MemoryHigh=1100M
MemoryMax=1500M
MemorySwapMax=512M
Restart=always
RestartSec=2
