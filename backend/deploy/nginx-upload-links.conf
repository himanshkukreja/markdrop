# Short upload links: PUT /u/<token> (app/routers/upload_links.py) carries one
# upload part — at most file_part_size (32 MiB) — through the API to R2. Put
# this inside the api.markdrop.in `server { listen 443 … }` block, then
# `sudo nginx -t && sudo systemctl reload nginx`. Without it nginx's default
# 1 MB body limit refuses parts with 413 (MARKDROP_UPLOAD_SHORT_LINKS=false in
# backend/.env turns the links off: the tools hand out presigned URLs again).
location /u/ {
    client_max_body_size 40m;
    client_body_timeout 300s;
    # Stream the body to the API (it spools and checks it) instead of buffering it here first.
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://markdrop_api;
}
