name: Deploy frontend to Vercel (Vercel builds from Git) — emergency only

# EMERGENCY ONLY, run by hand. The routine deploy is vercel-deploy.yml (built on GitHub Actions,
# uploaded as one archive). Use this only when that can't run, e.g. Vercel's daily upload limit
# ("api-upload-paid", 40000 files a day, shared with every project on the team). Vercel then builds
# the commit from GitHub on its own servers: nothing is uploaded from here, but it costs Vercel
# Build CPU minutes on the shared team plan, so it has no push trigger.
#
# Trigger: Actions › this workflow › Run workflow (on main), optionally with a commit sha;
#   gh workflow run vercel-git-deploy.yml --ref main [-f sha=<commit>]
# Uses the same secret and variables as vercel-deploy.yml.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (default: the head of the branch it runs on)"
        required: false
        default: ""

concurrency:
  group: vercel-git-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DEPLOY_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Ask Vercel to build and deploy this commit
        id: create
        run: |
          body=$(jq -n --arg p "$VERCEL_PROJECT_ID" --arg sha "$DEPLOY_SHA" --arg repo "${GITHUB_REPOSITORY#*/}" --arg org "${GITHUB_REPOSITORY%%/*}" \
            '{name: "markdrop", project: $p, target: "production",
              gitSource: {type: "github", org: $org, repo: $repo, ref: "main", sha: $sha},
              meta: {source: "actions-git", githubCommitSha: $sha}}')
          res=$(curl -sS -X POST "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "$body")
          id=$(echo "$res" | jq -r '.id // empty')
          if [ -z "$id" ]; then echo "Vercel refused: $(echo "$res" | jq -c '.error // .')"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Deployment $id: https://$(echo "$res" | jq -r .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait until it's live
        run: |
          for i in $(seq 1 140); do
            st=$(curl -sS "https://api.vercel.com/v13/deployments/${{ steps.create.outputs.id }}?teamId=$VERCEL_ORG_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.readyState // .status')
            echo "$(date -u +%T) $st"
            case "$st" in
              READY) echo "Live." >> "$GITHUB_STEP_SUMMARY"; exit 0;;
              ERROR|CANCELED) echo "Build $st"; exit 1;;
            esac
            sleep 15
          done
          echo "Timed out waiting"; exit 1
