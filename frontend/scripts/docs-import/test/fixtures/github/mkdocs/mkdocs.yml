site_name: Acme CLI
site_description: The Acme command line, documented.
repo_url: https://github.com/acme/docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: indigo
    - scheme: slate
      primary: deep purple

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  analytics_key: !ENV [ACME_ANALYTICS, "none"]

nav:
  - Home: index.md
  - User guide:
      - guide/install.md
      - Usage: guide/usage.md
      - Reference:
          - guide/reference/commands.md
  - Changelog: https://example.com/acme/changelog
