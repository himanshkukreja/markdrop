<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<title>Markdrop design system</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../tokens/type-classes.css">
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || localStorage.getItem("md-ds-theme") || "dark";</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
  header { position: sticky; top: 0; z-index: var(--z-sticky); display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); height: 56px; padding: 0 var(--space-6); background: var(--bg); border-bottom: 1px solid var(--border); }
  header .wm { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; } header .wm em { font-style: normal; color: var(--accent-text); }
  header .wm span { margin-left: var(--space-2); font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--text-muted); }
  .toggle { display: inline-flex; padding: 3px; border-radius: var(--radius-lg); background: var(--surface-inset); }
  .toggle button { all: unset; cursor: pointer; padding: 4px var(--space-3); border-radius: var(--radius-md); font-size: 13px; font-weight: 500; color: var(--text-muted); }
  .toggle button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .toggle button:focus-visible { outline: 2px solid var(--border-focus); }
  main { max-width: 1040px; margin: 0 auto; padding: var(--space-6); }
  .cover { width: 100%; height: 288px; border: 0; border-radius: var(--radius-xl); display: block; }
  nav.jump { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-6) 0; }
  nav.jump a { font-size: 13px; color: var(--text-secondary); text-decoration: none; padding: 4px var(--space-3); border-radius: var(--radius-full); border: 1px solid var(--border); }
  nav.jump a:hover { color: var(--text); border-color: var(--border-strong); }
  h2 { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: var(--space-10) 0 var(--space-3); }
  .card { border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; margin-bottom: var(--space-4); background: var(--surface); }
  .card__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
  .card__name { font-size: 14px; font-weight: 600; } .card__sub { font-size: 12px; color: var(--text-muted); margin-left: var(--space-2); font-weight: 400; }
  .card__links a { font-size: 12px; color: var(--accent-text); text-decoration: none; margin-left: var(--space-3); } .card__links a:hover { text-decoration: underline; }
  .card iframe { display: block; width: 100%; border: 0; background: var(--bg); }
  footer { margin: var(--space-12) 0 var(--space-6); font-size: 12px; color: var(--text-muted); }
  @media (max-width: 640px) { header { padding: 0 var(--space-4); } header .wm span { display: none; } main { padding: var(--space-4); } }
</style></head>
<body>
<header><div class="wm">mark<em>drop</em><span>design system</span></div>
  <div class="toggle" role="group" aria-label="Theme"><button type="button" data-t="dark">Dark</button><button type="button" data-t="light">Light</button></div></header>
<main>
  <iframe class="cover" title="Cover" data-src="cover.html"></iframe>
  <nav class="jump" aria-label="Groups"></nav>
  <div id="list"></div>
  <footer>Tokens: <code>tokens/tokens.json</code> · Brand rules: <code>BRAND.md</code> · Build: <code>npm run build</code></footer>
</main>
<script>
const CARDS = [{"name": "Button", "group": "Actions", "height": 230, "subtitle": "Six variants, three sizes"}, {"name": "IconButton", "group": "Actions", "height": 100, "subtitle": ""}, {"name": "Checkbox", "group": "Forms", "height": 230, "subtitle": ""}, {"name": "Field", "group": "Forms", "height": 300, "subtitle": ""}, {"name": "Input", "group": "Forms", "height": 300, "subtitle": ""}, {"name": "Radio", "group": "Forms", "height": 160, "subtitle": "Radio + RadioGroup"}, {"name": "Select", "group": "Forms", "height": 110, "subtitle": ""}, {"name": "Switch", "group": "Forms", "height": 140, "subtitle": ""}, {"name": "Textarea", "group": "Forms", "height": 150, "subtitle": ""}, {"name": "Avatar", "group": "Data display", "height": 110, "subtitle": "Avatar + AvatarGroup"}, {"name": "Badge", "group": "Data display", "height": 170, "subtitle": ""}, {"name": "Card", "group": "Data display", "height": 330, "subtitle": ""}, {"name": "Icon", "group": "Data display", "height": 440, "subtitle": "The built-in 24px line set"}, {"name": "Kbd", "group": "Data display", "height": 80, "subtitle": ""}, {"name": "Table", "group": "Data display", "height": 300, "subtitle": ""}, {"name": "Tag", "group": "Data display", "height": 90, "subtitle": ""}, {"name": "Breadcrumb", "group": "Navigation", "height": 70, "subtitle": ""}, {"name": "Pagination", "group": "Navigation", "height": 80, "subtitle": ""}, {"name": "Tabs", "group": "Navigation", "height": 150, "subtitle": "Line and pill variants"}, {"name": "Dialog", "group": "Overlays", "height": 380, "subtitle": ""}, {"name": "Drawer", "group": "Overlays", "height": 380, "subtitle": ""}, {"name": "Dropdown", "group": "Overlays", "height": 300, "subtitle": ""}, {"name": "Tooltip", "group": "Overlays", "height": 120, "subtitle": ""}, {"name": "Alert", "group": "Feedback", "height": 420, "subtitle": ""}, {"name": "EmptyState", "group": "Feedback", "height": 340, "subtitle": ""}, {"name": "Progress", "group": "Feedback", "height": 210, "subtitle": ""}, {"name": "Skeleton", "group": "Feedback", "height": 190, "subtitle": ""}, {"name": "Spinner", "group": "Feedback", "height": 90, "subtitle": ""}, {"name": "ToastProvider", "group": "Feedback", "height": 220, "subtitle": "ToastProvider + useToast()"}, {"name": "AccessGate", "group": "Markdrop", "height": 420, "subtitle": ""}, {"name": "AmbientBackground", "group": "Markdrop", "height": 280, "subtitle": "Hero backdrop + gradient text"}, {"name": "AssetUpload", "group": "Markdrop", "height": 200, "subtitle": ""}, {"name": "BulkGuide", "group": "Markdrop", "height": 300, "subtitle": ""}, {"name": "ColorPicker", "group": "Markdrop", "height": 120, "subtitle": ""}, {"name": "CopyButton", "group": "Markdrop", "height": 90, "subtitle": ""}, {"name": "CreateMenu", "group": "Markdrop", "height": 350, "subtitle": ""}, {"name": "DocumentRow", "group": "Markdrop", "height": 270, "subtitle": ""}, {"name": "FileIcon", "group": "Markdrop", "height": 120, "subtitle": ""}, {"name": "ImmersiveExit", "group": "Markdrop", "height": 140, "subtitle": ""}, {"name": "MarkdownToolbar", "group": "Markdrop", "height": 240, "subtitle": ""}, {"name": "MarkdropLoader", "group": "Markdrop", "height": 250, "subtitle": "The drop falls into the mark"}, {"name": "MarkdropLogo", "group": "Markdrop", "height": 130, "subtitle": "Mark, wordmark, and the two together"}, {"name": "RouteBadge", "group": "Markdrop", "height": 80, "subtitle": ""}, {"name": "RowMenu", "group": "Markdrop", "height": 260, "subtitle": ""}, {"name": "TransferExplainer", "group": "Markdrop", "height": 440, "subtitle": ""}, {"name": "VSCodeIcon", "group": "Markdrop", "height": 90, "subtitle": ""}, {"name": "AppHeader", "group": "Pages", "height": 120, "subtitle": "Logo, nav, theme toggle, Create, avatar"}, {"name": "Dashboard", "group": "Pages", "height": 560, "subtitle": "A composed page: header, filters, rows"}];
const root = document.documentElement, list = document.getElementById("list"), jump = document.querySelector("nav.jump");
let group = null;
for (const c of CARDS) {
  if (c.group !== group) {
    group = c.group; const id = group.toLowerCase().replace(/[^a-z]+/g, "-");
    const h = document.createElement("h2"); h.id = id; h.textContent = group; list.appendChild(h);
    const a = document.createElement("a"); a.href = "#" + id; a.textContent = group; jump.appendChild(a);
  }
  const card = document.createElement("section"); card.className = "card"; card.id = c.name;
  card.innerHTML = `<div class="card__head"><div class="card__name">${c.name}${c.subtitle ? `<span class="card__sub">${c.subtitle}</span>` : ""}</div><div class="card__links"><a href="../docs/components/${c.name}.md">Guidelines</a><a data-open="${c.name}.html" href="${c.name}.html">Open</a></div></div><iframe title="${c.name}" loading="lazy" data-src="${c.name}.html" style="height:${c.height}px"></iframe>`;
  list.appendChild(card);
}
function apply(t) {
  root.dataset.theme = t; try { localStorage.setItem("md-ds-theme", t); } catch {}
  document.querySelectorAll(".toggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
  document.querySelectorAll("iframe[data-src]").forEach(f => { f.src = f.dataset.src + "?theme=" + t; });
  document.querySelectorAll("a[data-open]").forEach(a => { a.href = a.dataset.open + "?theme=" + t; });
}
document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => apply(b.dataset.t)));
apply(root.dataset.theme);
</script>
</body>
</html>
