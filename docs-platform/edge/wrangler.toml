# The docs edge Worker (deployed to the docs Cloudflare account's workers.dev for previews). Build the bundle first:
#   node builder/cli.mjs bundle        → edge/dist/worker.mjs
# Local run with an emulated bucket: node test/miniflare.mjs (syncs a local store into it).
name = "markdrop-docs-edge"
main = "dist/worker.mjs"
compatibility_date = "2026-01-01"

# Every docs hostname routes here: <site>.guides.markdrop.in as Workers Custom Domains (attached by the
# API, backend/app/services/docs_cf_hosts.py), and customers' own domains (Cloudflare for SaaS custom
# hostnames) through a `*/*` route on the markdrop.in zone, with a Worker-less `*markdrop.in/*` route
# keeping Markdrop's own names out of it. Both routes are made once in the dashboard, in that order
# (README "Own domains (Cloudflare for SaaS)"); they are deliberately not declared here, so a deploy
# can never create the catch-all before its exclusion exists.

# The engine's shared files (/_next/static/{chunks,css,media}: content-hashed, identical for every
# site an engine version builds) as Workers Static Assets: served at the edge without invoking the
# Worker, so they cost no requests. `build` copies them here (--engine-assets, default this folder;
# deploy another one with `wrangler deploy --assets <dir>`). The folder is additive across builds and
# must hold the files of every engine version a live site uses (README: "Engine files as static
# assets").
#
# Routing: assets first, then the Worker. The folder holds nothing but /_next/static/ files, so every
# docs address (pages, payloads, .md, files, /mcp) misses it and runs the Worker, and so does an
# engine file the deployed folder lacks, which the Worker serves from R2 (the manifest still lists
# it). No run_worker_first rules on purpose: a path a rule sends to the assets (`!/_next/static/*`)
# is answered by the assets alone, and a miss there is a bare 404 that never reaches the Worker
# (measured on the preview), which would break that fallback. html_handling "none": no implicit
# index.html / trailing-slash lookups.
[assets]
directory = "./assets"
html_handling = "none"
not_found_handling = "none"

# Objects, manifests, pointers and host map (see builder/store.mjs for the key layout).
[[r2_buckets]]
binding = "DOCS"
bucket_name = "markdrop-docs-sites"

[vars]
# How long an isolate trusts the pointer it read: the publish → live delay. The same for a site's
# access policy (sites/<site>/access.json): a new password or level applies within this long.
POINTER_TTL_MS = "5000"
# Password and members-only sites (edge/access.mjs): the sign-in page posts passwords to the API and
# sends members to the app's /auth/docs-access. The shared secret is a Worker secret, never a var:
#   npx wrangler secret put DOCS_ACCESS_SECRET     (the API's MARKDROP_DOCS_ACCESS_SECRET)
MARKDROP_API_ORIGIN = "https://api.markdrop.in"
MARKDROP_APP_ORIGIN = "https://markdrop.in"
